<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Servicios Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      padding: 40px;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background: #0078d7;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .dashboard {
      margin-top: 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f5f5f5;
    }
    #mensajes {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Gestión de Páginas y Aplicaciones Web</h2>

    <!-- Paso 1: Crear la VM -->
    <label for="host">Nombre del host</label>
    <input type="text" id="host" placeholder="Ej. tienda">
    <button onclick="crearVM()">Aceptar (crear VM)</button>

    <!-- Paso 2: Subir archivo -->
    <label for="contenido">Archivo del sitio (ZIP)</label>
    <input type="file" id="contenido" accept=".zip">

    <!-- Paso 3: Publicar -->
    <button id="btnPublicar" onclick="publicar()" disabled>Publicar servicio</button>

    <div id="mensajes"></div>

    <!-- Registro -->
    <div class="dashboard">
      <h3>Registro de servicios desplegados</h3>
      <table id="tablaInstancias">
        <thead>
          <tr>
            <th>Host</th>
            <th>IP</th>
            <th>Enlace</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let ultimaIP = "";
    let ultimoHost = "";

    function mostrarMensaje(msg, ok=true) {
      const div = document.getElementById("mensajes");
      div.style.color = ok ? "green" : "red";
      div.textContent = msg;
    }

    //
    async function crearVM() {
      const host = document.getElementById("host").value.trim();
      if (!host) {
        alert("Debes ingresar un nombre de host.");
        return;
      }

      mostrarMensaje("Creando máquina virtual...");
      try {
        const form = new FormData();
        form.append("host", host);

        const resp = await fetch("/crear", { method: "POST", body: form });
        const data = await resp.json();

        if (data.exito) {
          ultimaIP = data.ip;
          ultimoHost = host;
          document.getElementById("btnPublicar").disabled = false;
          mostrarMensaje(`Máquina ${host} creada con IP ${data.ip}. Listo para publicar.`);
          //mostrarMensaje(`Máquina ${host} creada con IP ${data.ip}`);
         // agregarFila(host, data.ip, `http://${data.ip}/`, data.fecha);
        } else {
          mostrarMensaje("Error al crear la VM: " + data.mensaje, false);
        }
      } catch (err) {
        mostrarMensaje("Error en la creación: " + err.message, false);
      }
    }

    async function publicar() {
      const host = document.getElementById("host").value.trim();
      const archivo = document.getElementById("contenido").files[0];

      if (!host || !archivo) {
        alert("Debes ingresar un host y seleccionar un archivo ZIP.");
        return;
      }

      if (host !== ultimoHost || !ultimaIP) {
        alert("Primero debes crear la VM con el botón 'Aceptar'.");
        return;
      }

      mostrarMensaje("Publicando sitio web en la VM...");

      try {
        // ... (Código para preparar el form)

        // 🚨 Paso intermedio: Si la fila no existe (solo se creó la VM), 
        // la agregamos con el valor de IP antes de publicar (opcional, para feedback).
        // Sin embargo, lo más limpio es añadirla directamente con el resultado FINAL.

        const resp = await fetch("/publicar", { method: "POST", body: form });
        const resData = await resp.json(); // Cambiado a resData para evitar conflicto con 'data' de la respuesta

        if (resData.exito) {
          // La respuesta final ahora tiene la URL con el FQDN
          const data = resData.datos; 
          
          // 🚨 AGREGAMOS/ACTUALIZAMOS LA FILA AQUÍ, DESPUÉS DEL DNS
          actualizarFila(data.Host, data.IP, data.URL, data.Fecha);

          mostrarMensaje(`Sitio publicado correctamente. Enlace: ${data.URL}`);

          // Desactivar el botón para forzar una nueva VM o un nuevo "Aceptar"
          document.getElementById("btnPublicar").disabled = true;

        } else {
          mostrarMensaje("Error al publicar: " + resData.mensaje, false);
        }
      } catch (err) {
        mostrarMensaje("Error en la publicación: " + err.message, false);
      }
    }

    function agregarFila(host, ip, url, fecha) {
      const tbody = document.querySelector("#tablaInstancias tbody");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${host}</td>
        <td>${ip}</td>
        <td><a href="${url}" target="_blank">${url}</a></td>
        <td>${fecha}</td>
        <td><button onclick="eliminarFila(this)">Eliminar</button></td>
      `;
      tbody.appendChild(tr);
    }

    function actualizarFila(host, ip, url, fecha) {
      const filas = document.querySelectorAll("#tablaInstancias tbody tr");
      for (let f of filas) {
        if (f.cells[0].textContent === host) {
          f.cells[1].textContent = ip;
          f.cells[2].innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
          f.cells[3].textContent = fecha;
          return;
        }
      }
      agregarFila(host, ip, url, fecha);
    }

    function eliminarFila(btn) {
      const fila = btn.closest("tr");
      const host = fila.cells[0].textContent;
      const ip = fila.cells[1].textContent;

      if (!confirm(`¿Eliminar el servicio ${host}?`)) return;

      fetch("/eliminar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({host, ip})
      })
      .then(r => r.json())
      .then(data => {
        if (data.exito) fila.remove();
        else alert("Error al eliminar: " + data.mensaje);
      })
      .catch(err => alert("Error: " + err.message));
    }
  </script>
</body>
</html>
